<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{AppTitle}}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { 500: '#2673e8', 600: '#1c5bba', 700: '#154996' }
                    }
                }
            }
        }
    </script>
</head>
<body class="flex h-screen bg-gray-50 text-gray-800">
    <!-- Notification Toast Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-[9999] flex flex-col gap-2"></div>

    <!-- Sidebar de navigation -->
    <aside class="w-64 bg-gray-900 text-white flex-col hidden md:flex">
        <div class="p-6 border-b border-gray-800">
            <h2 class="text-xl font-bold">{{AppTitle}}</h2>
        </div>
        <nav class="flex-1 p-4 space-y-2">
{{sidebarLinks}}
        </nav>
    </aside>

    <!-- Contenu Principal -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <!-- Header -->
        <header class="bg-white h-16 border-b border-gray-200 flex items-center justify-between px-6">
            <div class="font-medium text-gray-600">
                {{CurrentSectionTitle}}
            </div>
            <div class="flex items-center gap-2">
                <span class="text-sm font-semibold bg-gray-100 text-gray-700 px-3 py-1 rounded-full">Admin</span>
            </div>
        </header>

        <!-- Main Body -->
        <main class="flex-1 overflow-y-auto p-6 bg-gray-50">
            <div class="max-w-5xl mx-auto space-y-8">
                <!-- Action Header -->
                <div class="flex justify-between items-center">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">{{EntityPluralTitle}}</h1>
                    </div>
                    <button id="btn-show-form-{{entityLower}}" class="bg-primary-600 hover:bg-primary-700 text-white px-4 py-2 rounded shadow transition">
                        + Nouveau {{EntitySingularTitle}}
                    </button>
                </div>

                <!-- Form Card (repliable) -->
                <div id="section-form-{{entityLower}}" class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 hidden">
                    <h2 class="text-lg font-bold mb-4 text-gray-900">Ajouter un(e) {{EntitySingularTitle}}</h2>
                    <form id="form-{{entityLower}}" class="space-y-4">
{{formFields}}
                        <div class="flex justify-end gap-2 mt-4">
                            <button type="button" id="btn-cancel-form-{{entityLower}}" class="px-4 py-2 text-gray-600 border border-gray-300 rounded hover:bg-gray-100 transition">
                                Annuler
                            </button>
                            <button type="submit" id="enregistrer-{{entityLower}}" class="px-4 py-2 bg-primary-600 text-white rounded hover:bg-primary-700 transition">
                                Enregistrer
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Table Card -->
                <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-gray-50 border-b border-gray-200">
                            <tr>
                                <th class="p-4 text-sm font-semibold text-gray-500 uppercase">ID</th>
{{tableHeaders}}
                            </tr>
                        </thead>
                        <tbody id="table-{{entitiesLower}}-body" class="divide-y divide-gray-100">
                            <!-- Rempli dynamiquement en JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="assets/js/app.js"></script>
</body>
</html>
